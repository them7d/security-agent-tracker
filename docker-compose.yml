services:
  postgres:
    image: postgres:17-alpine
    container_name: sentinelsec-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sentinel}
      POSTGRES_DB: ${POSTGRES_DB:-sentinel_sec}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sentinel} -d ${POSTGRES_DB:-sentinel_sec}"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 15s
    networks:
      sentinelsec:
        aliases:
          - postgres


  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sentinelsec-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-sentinel}:${POSTGRES_PASSWORD:-sentinel}@postgres:5432/${POSTGRES_DB:-sentinel_sec}?schema=public&sslmode=disable&connect_timeout=30"
      NEXTAUTH_URL: "${NEXTAUTH_URL:-http://localhost:5000}"
      NEXTAUTH_SECRET: "${NEXTAUTH_SECRET:-DhbI3ZaSvjgUhPAHPNa1/DGfzgUl5fxbsjBVjqggMSk=}"
      POSTGRES_USER: ${POSTGRES_USER:-sentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sentinel}
      POSTGRES_DB: ${POSTGRES_DB:-sentinel_sec}
    ports:
      - "${APP_PORT:-5000}:5000"
    networks:
      - sentinelsec

volumes:
  postgres_data:
    name: sentinelsec-postgres-data

networks:
  sentinelsec:
    name: sentinelsec-net
    driver: bridge
    enable_ipv6: false