# ============================================================
# SentinelSec — docker-compose
# Auto-links Postgres + app. The app container's entrypoint runs
# `prisma migrate deploy` + the seed script before starting Next.js,
# so a fresh `docker compose up` produces a fully working app.
#
# Usage:
#   cp .env.example .env
#   docker compose up --build
#   open http://localhost:3000
# ============================================================

services:
  postgres:
    image: postgres:17-alpine
    container_name: sentinelsec-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sentinel}
      POSTGRES_DB: ${POSTGRES_DB:-sentinel_sec}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sentinel} -d ${POSTGRES_DB:-sentinel_sec}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sentinelsec

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sentinelsec-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Auto-link: the app connects to the `postgres` service by name.
      DATABASE_URL: "postgresql://${POSTGRES_USER:-sentinel}:${POSTGRES_PASSWORD:-sentinel}@postgres:5432/${POSTGRES_DB:-sentinel_sec}?schema=public"
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-sentinel-dev-secret-change-me-in-production}
    ports:
      - "${APP_PORT:-3000}:3000"
    networks:
      - sentinelsec

volumes:
  postgres_data:
    name: sentinelsec-postgres-data

networks:
  sentinelsec:
    name: sentinelsec-net
    driver: bridge
