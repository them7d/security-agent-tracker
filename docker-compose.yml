# ============================================================
# SentinelSec — docker-compose for local / self-hosted deploy
#
# Usage:
#   1. Copy .env.example to .env and edit values (or just use defaults)
#   2. docker compose up --build
#   3. Open http://localhost:3000
#
# The app container's entrypoint runs `prisma migrate deploy` + the seed
# script before starting Next.js, so a fresh `docker compose up` produces
# a fully working app with demo data.
# ============================================================

services:
  postgres:
    image: postgres:17-alpine
    container_name: sentinelsec-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sentinel}
      POSTGRES_DB: ${POSTGRES_DB:-sentinel_sec}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Expose only if you want to inspect from host; safe to remove.
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sentinel} -d ${POSTGRES_DB:-sentinel_sec}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sentinelsec

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sentinelsec-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Prisma needs the internal Docker network hostname `postgres`
      DATABASE_URL: "postgresql://${POSTGRES_USER:-sentinel}:${POSTGRES_PASSWORD:-sentinel}@postgres:5432/${POSTGRES_DB:-sentinel_sec}?schema=public"
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-sentinel-dev-secret-change-me-in-production}
    ports:
      - "${APP_PORT:-3000}:3000"
    networks:
      - sentinelsec

volumes:
  postgres_data:
    name: sentinelsec-postgres-data

networks:
  sentinelsec:
    name: sentinelsec-net
    driver: bridge
